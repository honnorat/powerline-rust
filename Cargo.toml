[package]
name = "powerline"
version = "0.4.1"
authors = ["cirho <me@cirho.com>", "Marc Honnorat <marc@honnorat.fr>"]
edition = "2024"
rust-version = "1.88"

[dependencies]
uzers = "0.12.2"
libc = "0.2.189"
gix = { version = "0.88.0", default-features = false, features = ["status", "revision", "sha1"], optional = true }

[features]
default = ["bash-shell", "gitoxide"]
bash-shell = []
bare-shell = []
zsh-shell = []
gitoxide = ["dep:gix"]
time = []

[profile.release]
lto = true
